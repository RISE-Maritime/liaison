[package]
name = "liaison-network-benchmarks"
version = "0.1.0"
edition = "2021"
authors = ["RISE Maritime"]
license = "MIT"

[[bin]]
name = "latency_test"
path = "latency_test.rs"

[[bin]]
name = "throughput_test"
path = "throughput_test.rs"

[dependencies]
# Zenoh for communication
zenoh = "1.0"

# Protocol Buffers
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
